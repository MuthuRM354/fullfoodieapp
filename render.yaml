      - fromGroup: shared-secrets
      - key: JAVA_OPTS
        value: -Xmx400m -Xms128m -XX:+UseSerialGC
      - key: SERVER_PORT
        value: 8089
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
