server.port=8086
spring.application.name=notification-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodieapp_notifications?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:foodieapp-super-secret-key-for-jwt-minimum-256-bits-long}

# Shared secret used to authenticate trusted server-to-server calls from
# other backend services (e.g. order-service posting a notification), and
# used by this service to call user-service to resolve email/phone.
internal.api-key=${INTERNAL_API_KEY:foodieapp-internal-service-key-change-me}

# Inter-service URL — used to look up a user's email/phone by userId when
# the caller didn't already include it in the notification payload.
services.user.url=${USER_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# spring.mail.host is always configured (see below), but real SMTP credentials
# are optional (log-only fallback when unset) — don't let Spring Boot's mail
# health indicator fail /actuator/health (and Render's health check) just
# because MAIL_USERNAME/MAIL_PASSWORD aren't set.
management.health.mail.enabled=false

# ---- Email (Gmail SMTP) ----
# Leave MAIL_USERNAME/MAIL_PASSWORD unset to run in log-only mode (no real
# email is sent, everything is logged instead — useful for local dev).
# To send real email: create a Gmail App Password (Google Account ->
# Security -> 2-Step Verification -> App Passwords) and set MAIL_USERNAME to
# the Gmail address and MAIL_PASSWORD to the 16-character app password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
notification.email.from=${MAIL_FROM:${MAIL_USERNAME:noreply@foodieapp.local}}
notification.email.enabled=${MAIL_ENABLED:true}

# ---- SMS (Fast2SMS — free-tier, no subscription required) ----
# Fast2SMS gives free credits on signup (https://www.fast2sms.com), no
# recurring subscription. Leave FAST2SMS_API_KEY unset to run in log-only
# mode. Uses the "q" (Quick, no-DLT) route which works for transactional-
# style text without a registered sender ID — fine for a demo/dev project.
fast2sms.api-key=${FAST2SMS_API_KEY:}
fast2sms.api-url=https://www.fast2sms.com/dev/bulkV2
notification.sms.enabled=${SMS_ENABLED:true}
