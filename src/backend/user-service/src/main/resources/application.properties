server.port=8081
spring.application.name=user-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodieapp_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Aiven's free MySQL tier caps max_connections quite low and is shared
# across all 9 backend services — keep each service's pool tiny so nine
# services together stay well under the limit instead of exhausting it.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:foodieapp-super-secret-key-for-jwt-minimum-256-bits-long}
jwt.expiration=86400000
# Shared secret trusted backend services use to call each other directly
# (e.g. notification-service resolving a user's email/phone). Must match
# the same value configured on the calling service.
internal.api-key=${INTERNAL_API_KEY:foodieapp-internal-service-key-change-me}
# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
