server.port=8089
spring.application.name=admin-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodieapp_admin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Aiven's free MySQL tier caps max_connections quite low and is shared
# across all 9 backend services — keep each service's pool tiny so nine
# services together stay well under the limit instead of exhausting it.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:foodieapp-super-secret-key-for-jwt-minimum-256-bits-long}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
