server.port=8088
spring.application.name=review-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodieapp_reviews?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:foodieapp-super-secret-key-for-jwt-minimum-256-bits-long}

# Shared secret used to authenticate this service's calls to other backend
# services (e.g. restaurant-service). Must match the same value configured
# on the receiving service.
internal.api-key=${INTERNAL_API_KEY:foodieapp-internal-service-key-change-me}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Inter-service URLs
services.restaurant.url=${RESTAURANT_SERVICE_URL:http://localhost:8082}
