server.port=8080
spring.application.name=api-gateway

# Service URLs (override via env vars in production)
services.user=http://localhost:8081
services.restaurant=http://localhost:8082
services.order=http://localhost:8083
services.payment=http://localhost:8084
services.delivery=http://localhost:8085
services.notification=http://localhost:8086
services.review=http://localhost:8088
services.tracking=http://localhost:8087
services.admin=http://localhost:8089

jwt.secret=${JWT_SECRET:foodieapp-super-secret-key-for-jwt-minimum-256-bits-long}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.mvc.async.request-timeout=30000

# CORS: set to your Vercel URL in production, e.g. https://fullfoodieapp.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
